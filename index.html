<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEN 301 Engineering Statistics Quiz</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);

  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {

    background-clip: text;
    color: transparent;
  }

  .progress-bar {
    height: 8px;
    background: #334155;
    border-radius: 999px;
    overflow: hidden;
    margin: 16px 0 24px;
  }

    height: 100%;

  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    border: 1px solid #334155;
  }

  .qnum {
    display: inline-block;
    background: rgba(99,102,241,0.15);
    color: #a5b4fc;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .qtext {
    font-size: 1.05rem;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 0.95rem;

    width: 26px; height: 26px;
    border-radius: 50%;
    background: #334155;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
    color: var(--muted);
  }
  .opt.selected .letter { background: var(--accent); color: white; }

    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 10px;
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: white; flex: 1; }
  .btn-secondary { background: #334155; color: var(--text); }

  .hidden { display: none !important; }

    text-align: center;
    padding: 30px 20px;
  }
  .score-num {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

  .stat-box {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }

  .stat-box.correct .n { color: var(--correct); }
  .stat-box.wrong .n { color: var(--wrong); }
  .stat-box .l { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    color: var(--muted);
    padding: 8px;
    font-size: 0.8rem;
    border-radius: 8px;
  }
  .filter-btn.active { border-color: var(--accent); color: var(--text); }

  .review-item {
    background: #0f172a;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-left: 4px solid var(--wrong);
  }

  .review-item .ra { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .review-item .ra .tag-wrong { color: var(--wrong); font-weight: 600; }

  .review-item .badge {

  #reviewList { margin-top: 10px; }

  .top-actions { display:flex; gap:10px; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GEN 301 &mdash; Engineering Statistics</h1>
    <p>Multiple-choice practice quiz &middot; 300 questions</p>
  </header>

      </div>
    </div>
  </div>

  <div id="resultsScreen" class="hidden">
    <div class="card">
      <div class="score-hero">

        <div class="score-sub" id="scoreSub">0 of 300 correct</div>

        <button class="filter-btn" data-filter="wrong">Missed</button>

      </div>
      <div id="reviewList"></div>
      <div class="top-actions">
        <button class="btn-secondary" id="restartBtn" style="flex:1">Retake Quiz</button>
      </div>
    </div>
  </div>
</div>

ency", "Autopilot", "Likelihood"], "answer": "Quality; Efficiency"}, {"num": 19, "q": "Engineering statistics plays an important role in ____ and ____ by reducing waste and improving productivity.", "options": ["Lean Manufacturing; Six Sigma", "Informed", "Highest", "Reliability; Risk"], "answer": "Lean Manufacturing; Six Sigma"}, {"num": 20, "q": "Engineering statistics supports ____ and ____ by helping engineers evaluate prototypes and improve innovations.", "options": ["Research; Development (R&D)", "Measures of Dispersion", "Bell", "Infinite"], "answer": "Research; Development (R&D)"}, {"num": 21, "q": "Engineering statistics helps engineers assess ____ and ____ associated with engineering systems.", "options": ["No", "Non-probability", "Reliability; Risk", "Cluster"], "answer": "Reliability; Risk"}, {"num": 22, "q": "Statistical methods used to estimate project costs and resource requirements improve ____ and ____.", "options": ["Q1", "N", "Midpoint", "Budgeting; Resource allocation"], "answer": "Budgeting; Resource allocation"}, {"num": 23, "q": "Statistical methods that identify inefficiencies and reduce waste support ____ improvement.", "options": ["Continuous", "Non-response", "Below", "Midpoint"], "answer": "Continuous"}, {"num": 24, "q": "Engineering statistics is widely applied in ____ testing and analysis for selecting suitable engineering materials.", "options": ["Continuous", "Real-life", "Informed", "Materials"], "answer": "Materials"}, {"num": 25, "q": "Engineers use ____ modelling and simulation to predict future system behaviour.", "options": ["Reliability", "Predictive", "Sampling", "Decision-making"], "answer": "Predictive"}, {"num": 26, "q": "Engineering statistics assists engineers in complying with environmental and ____ regulations.", "options": ["Large", "Safety", "Ascending", "fx"], "answer": "Safety"}, {"num": 27, "q": "Statistical methods enable engineers to document and ____ engineering findings effectively.", "options": ["Risk Analysis", "Ascending", "Report", "Mode"], "answer": "Report"}, {"num": 28, "q": "The method that systematically investigates cause-and-effect relationships among process variables is called ____.", "options": ["Census", "Existing", "Standard", "Design of Experiments (DOE)"], "answer": "Design of Experiments (DOE)"}, {"num": 29, "q": "In a welding optimization study, examples of factors investigated include welding current, welding speed and ____ gas flow rate.", "options": ["One (1)", "Probabilistic", "Shielding", "Mean"], "answer": "Shielding"}, {"num": 30, "q": "The primary objective of Design of Experiments is to determine the ____ combination of process variables.", "options": ["Optimal", "Sample", "Organization", "Data"], "answer": "Optimal"}, {"num": 31, "q": "In manufacturing, inspectors who examine finished products are performing ____ Control.", "options": ["Quality", "Relative", "Data collection", "Qualitative"], "answer": "Quality"}, {"num": 32, "q": "Monitoring temperature, pressure and flow rate during production is an example of ____ Control.", "options": ["Process", "Cost-effective", "Reliability", "Optimal"], "answer": "Process"}, {"num": 33, "q": "Electronic circuit boards that fail inspection are either discarded or ____.", "options": ["Reworked", "Highest", "Cost-effective", "Maximum"], "answer": "Reworked"}, {"num": 34, "q": "A chemical processing plant periodically analyzes product composition to ensure it meets ____.", "options": ["Response", "Specifications", "Biased", "Middle"], "answer": "Specifications"}, {"num": 35, "q": "Time and Methods Engineering is a branch of ____ Engineering.", "options": ["Cost", "Variability", "Industrial", "Median"], "answer": "Industrial"}, {"num": 36, "q": "One objective of Time and Methods Engineering is to eliminate production ____.", "options": ["Finite", "Z", "Percentiles", "Bottlenecks"], "answer": "Bottlenecks"}, {"num": 37, "q": "Introducing powered tools into an assembly line is one method of improving ____.", ective", "Mean; Median; Mode"], "answer": "Cost-effective"}, {"num": 47, "q": "A pressure vessel is commonly designed using ____ design principles.", "options": ["Measures of Position", "Probabilistic", "Extreme", "Variability"], "answer": "Probabilistic"}, {"num": 48, "q": "____ is the technique used to develop mathematical models of systems using measured inputs and outputs.", "options": ["Failure", "∑x", "Unimodal", "System Identification"], "answer": "System Identification"}, {"num": 49, "q": "System identification is widely applied in designing ____ systems for aircraft.", "options": ["Many", "Autopilot", "Margin", "Quality Control"], "answer": "Autopilot"}, {"num": 50, "q": "In condition monitoring, engineers compare measured machine ____ with model predictions to detect faults.", "options": ["Vibrations", "Mitigation", "Ascending", "fx"], "answer": "Vibrations"}, {"num": 51, "q": "System identification supports ____ maintenance by detecting faults before serious damage occurs.", "options": ["Strata", "Preventive", "Quantitative", "Reliability"], "answer": "Preventive"}, {"num": 52, "q": "____ modelling uses historical data and statistical methods to forecast future system behaviour.", "options": ["Generalized", "Predictive", "Quality; Efficiency", "Sampling"], "answer": "Predictive"}, {"num": 53, "q": "Predicting the Remaining Useful Life (RUL) of equipment is an application of ____ modelling.", "options": ["Design of Experiments (DOE)", "Textual", "Surveys", "Predictive"], "answer": "Predictive"}, {"num": 54, "q": "Building engineers use predictive models to optimize ____, ventilation and air conditioning systems.", "options": ["Strata", "Deciles", "Heating", "Outliers"], "answer": "Heating"}, {"num": 55, "q": "Predictive modelling assists engineers in reducing ____ consumption in buildings.", "options": ["Mode", "Present", "Energy", "Bell"], "answer": "Energy"}, {"num": 56, "q": "____ analysis is the systematic process of identifying, assessing and prioritizing engineering hazards.", "options": ["Risk", "Quality", "Unbiased", "Power"], "answer": "Risk"}, {"num": 57, "q": "Risk analysis evaluates hazards based on their ____ and severity.", "options": ["Organization", "x-bar (x̄)", "Likelihood", "Standard Deviation"], "answer": "Likelihood"}, {"num": 58, "q": "During the design of a medical device, engineers prioritize ____ strategies after assessing risks.", "options": ["Reliability", "Longitudinal", "Smallest", "Mitigation"], "answer": "Mitigation"}, {"num": 59, "q": "Engineering ____ is a continuous process used to select the most appropriate engineering solution after evaluating available alternatives.", "options": ["Infinite", "Decision-making", "Extreme", "Qualitative"], "answer": "Decision-making"}, {"num": 60, "q": "When selecting a material for an engineering product, engineers consider strength, weight, corrosion resistance, cost and ease of ____.", "options": ["Accurate", "Unstructured", "Census", "Manufacturing"], "answer": "Manufacturing"}, {"num": 61, "q": "____ is the systematic process of gathering and measuring information on variables of interest.", "options": ["Data collection", "Consistent", "Engineering", "Quantitative"], "answer": "Data collection"}, {"num": 62, "q": "Data collection methods are broadly classified into ____ and ____ data collection.", "options": ["Primary; Secondary", "Quartiles; Deciles; Percentiles", "Population", "σ"], "answer": "Primary; Secondary"}, {"num": 63, "q": "____ data collection involves gathering new data directly from the original source.", "options": ["Primary", "Small", "Standard", "Scattered"], "answer": "Primary"}, {"num": 64, "q": "____ data collection involves using existing data collected by someone else.", "options": ["Mode", "Surveys", "Secondary", "Likelihood"], "answer": "Secondary"}, {"num": 65, "q": "Structured questionnaires administered to respondents are known as ____.", "options": ["Probabilistic", "Surveys", "Two", "Frequency"], "answer": "Surveys"}, {"num": 66, "q": "A data collection method that allows in-depth interaction between the researcher and participants is called ____.", "options": ["Many", "Large", "Interviews", "Implement"], "answer": "Interviews"}, {"num": 67, "q": "Interviews may be structured, semi-structured or ____.", "options": ["One (1)", "Unstructured", "Interpretation", "Empirical"], "answer": "Unstructured"}, {"num": 68, "q": "Researchers who directly watch and record behaviours are using the ____ method.", "options": ["Ascending", "Decision-making", "Observation", "Sample size"], "answer": "Observation"}, {"num": 69, "q": "____ involve manipulating variables to determine their effects on an outcome.", "options": ["Z", "Continuous", "Testing", "Experiments"], "answer": "Experiments"}, {"num": 70, "q": "A small group brought together to discuss a product or topic is called a ____ group.", "options": ["Quality Control", "Focus", "Simple Random Sampling", "Central"], "answer": "Focus"}, {"num": 71, "q": "Government agencies and research institutions commonly provide ____ datasets for secondary data collection.", "options": ["Existing", "Analysis", "Yamane", "Preventive"], "answer": "Existing"}, {"num": 72, "q": "Books, journals and reports used as sources of information are examples of ____ materials.", "options": ["Probability", "Width", "Published", "Above"], "answer": "Published"}, {"num": 73, "q": "Internal company information such as sales and employee performance records are called ____ records.", "options": ["Organizational", "Vibrations", "Histogram", "Median"], "answer": "Organizational"}, {"num": 74, "q": "____ is the process of selecting a subset of individuals or items from a larger population.", "options": ["Sampling", "Quantitative", "Autopilot", "Optimal"], "answer": "Sampling"}, {"num": 75, "q": "The entire collection of individuals or items sharing a common characteristic is known as the ____.", "options": ["Population", "Frequency", "Standard", "Position"], "answer": "Pop es", "Research", "Probabilistic"], "answer": "Research"}];

let current = 0;
const userAnswers = new Array(QUIZ.length).fill(null);

const qNumLabel = document.getElementById('qNumLabel');
const qText = document.getElementById('qText');
const optionsBox = document.getElementById('optionsBox');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressFill = document.getElementById('progressFill');
const quizScreen = document.getElementById('quizScreen');
const resultsScreen = document.getElementById('resultsScreen');

function renderQuestion() {
  const item = QUIZ[current];
  qNumLabel.textContent = `Question ${current + 1} of ${QUIZ.length}`;
  qText.textContent = item.q.replace('____', '_____');
  optionsBox.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  item.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'opt';
    if (userAnswers[current] === opt) div.classList.add('selected');
    div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt}</span>`;
    div.addEventListener('click', () => {
      userAnswers[current] = opt;
      renderQuestion();
    });
    optionsBox.appendChild(div);
  });
  prevBtn.disabled = current === 0;
  nextBtn.disabled = userAnswers[current] === null;
  nextBtn.textContent = current === QUIZ.length - 1 ? 'Finish' : 'Next';
  progressFill.style.width = `${((current + 1) / QUIZ.length) * 100}%`;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(); }
});

nextBtn.addEventListener('click', () => {
  if (current === QUIZ.length - 1) {
    showResults();
  } else {
    current++;
    renderQuestion();
  }
});

function showResults() {
  quizScreen.classList.add('hidden');
  resultsScreen.classList.remove('hidden');

  let correctCount = 0;
  QUIZ.forEach((item, i) => {
    if (userAnswers[i] === item.answer) correctCount++;
  });
  const wrongCount = QUIZ.length - correctCount;
  const pct = Math.round((correctCount / QUIZ.length) * 100);

  document.getElementById('scoreNum').textContent = `${pct}%`;
  document.getElementById('scoreSub').textContent = `${correctCount} of ${QUIZ.length} correct`;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;

  renderReview('all');
}

function renderReview(filter) {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  QUIZ.forEach((item, i) => {
    const isCorrect = userAnswers[i] === item.answer;
    if (filter === 'wrong' && isCorrect) return;
    if (filter === 'correct' && !isCorrect) return;
    const div = document.createElement('div');
    div.className = 'review-item' + (isCorrect ? ' ok' : '');
    const userAns = userAnswers[i] === null ? '(no answer)' : userAnswers[i];
    div.innerHTML = `
      <div class="badge">${isCorrect ? 'CORRECT' : 'MISSED'} &middot; Q${item.num}</div>
      <div class="rq">${item.q.replace('____', '_____')}</div>
      <div class="ra">
        Your answer: <span class="${isCorrect ? 'tag-correct' : 'tag-wrong'}">${userAns}</span>
        ${isCorrect ? '' : `<br>Correct answer: <span class="tag-correct">${item.answer}</span>`}
      </div>
    `;
    list.appendChild(div);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderReview(btn.dataset.filter);
  });
});

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0;
  userAnswers.fill(null);
  resultsScreen.classList.add('hidden');
  quizScreen.classList.remove('hidden');
  renderQuestion();
});

renderQuestion();
</script>
